version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heart-disease-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    networks:
      - heart-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.0
    container_name: heart-disease-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow-artifacts
    volumes:
      - mlflow-artifacts:/mlflow-artifacts
      - mlflow-db:/mlflow
    networks:
      - heart-network

volumes:
  mlflow-artifacts:
  mlflow-db:

networks:
  heart-network:
    driver: bridge
